<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1f17" />
    <title>DomuSafe — offline</title>
    <style>
      :root {
        --ink: #0b1f17;
        --cream: #e8f2ec;
        --gold: #f0b429;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(160deg, var(--ink), #143528 55%, #1a5c3a);
        color: var(--cream);
      }
      main {
        max-width: 26rem;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      h1 {
        margin: 1rem 0 0.5rem;
        font-size: 1.75rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        line-height: 1.5;
        opacity: 0.92;
      }
      button {
        margin-top: 1.5rem;
        min-height: 48px;
        min-width: 12rem;
        border: 2px solid var(--gold);
        border-radius: 8px;
        background: var(--gold);
        color: var(--ink);
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/domusafe-logo.svg" alt="DomuSafe" width="72" height="72" />
      <h1>DomuSafe</h1>
      <p>
        Sei offline. La shell dell’app resta disponibile; per accedere all’account
        e ai dati della Famiglia serve di nuovo la connessione.
      </p>
      <button type="button" onclick="location.reload()">Riprova</button>
    </main>
  </body>
</html>
