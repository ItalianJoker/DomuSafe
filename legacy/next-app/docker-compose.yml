# DomuSafe SaaS — app + Postgres (fonte di verità)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: domusafe
      POSTGRES_PASSWORD: domusafe
      POSTGRES_DB: domusafe
    ports:
      - '5432:5432'
    volumes:
      - domusafe-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U domusafe -d domusafe']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  domusafe:
    build:
      context: .
      args:
        NEXT_PUBLIC_DOMUSAFE_TIER: FREE
    image: domusafe:local
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://domusafe:domusafe@db:5432/domusafe
      DOMUSAFE_SOS_PROVIDER: log
      NEXT_PUBLIC_DOMUSAFE_TIER: FREE
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  domusafe-pg:
